[tool.poetry]
name = "connectors"
version = "0.1.0"
description = "Standalone database connector library for data platform pipelines. Provides abstract interfaces and implementations for Oracle, Postgres, and CSV-based mock connectors."
authors = ["Data Engineering Team"]
readme = "README.md"
packages = [{include = "connectors"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
# cx-Oracle = "^8.3.0"  # Uncomment when using real Oracle connectivity

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
